name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build for RimWorld 1.7
        run: dotnet build Source/SmarterBeds/SmarterBeds.csproj -c Release -p:GameVersion=1.7
      - name: Build for RimWorld 1.6
        run: dotnet build Source/SmarterBeds/SmarterBeds.csproj -c Release -p:GameVersion=1.6
      - name: Package mod folder
        run: |
          mkdir -p dist/SmarterBeds
          for d in About 1.6 1.7 Defs Languages Patches Textures; do
            [ -d "$d" ] && cp -r "$d" dist/SmarterBeds/
          done
          find dist -name .gitkeep -delete
          cp LICENSE dist/SmarterBeds/
          cd dist && zip -r ../SmarterBeds-${GITHUB_REF_NAME}.zip SmarterBeds
      - uses: softprops/action-gh-release@v2
        with:
          files: SmarterBeds-*.zip
          generate_release_notes: true
